[project]
name = "llm-npc-arbiter"
version = "0.1.0"
description = "The model decides, code verifies and applies: a write-atom gate, a validated state ledger and a graded dice check, extracted from a private LLM-driven game mod."
requires-python = ">=3.11"
dependencies = []

# The arbiter and the knowledge layer are standard library only, by design: the runtime ships
# inside a game installation, where a dependency tree is a liability. Tests need nothing extra.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
